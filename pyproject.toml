[project]
name = "x-iran-awareness-bot"
version = "0.1.0"
description = "Automated X/Twitter bot powered by LLM that generates and posts Iran awareness content automatically. Features OAuth2 PKCE authentication, token refresh, and scheduled posting."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai>=2.15.0",
    "python-dotenv>=1.2.1",
    "tweepy>=4.16.0",
    "xdk>=0.5.0",
]
